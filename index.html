<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>১০টি লিংকের m3u8 প্লেয়ার (অটো-রোটেশন সহ)</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #1e1e1e;
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            color: white;
        }

        .video-container {
            position: relative;
            width: 720px;
            max-width: 100%;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            margin-bottom: 20px;
        }

        .video-container:fullscreen {
            width: 100vw;
            height: 100vh;
            border-radius: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        video {
            width: 100%;
            display: block;
        }

        .video-container:fullscreen video {
            height: 100%;
            object-fit: contain;
        }

        .controls {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 12px;
            position: absolute;
            bottom: 0;
            width: 100%;
            box-sizing: border-box;
            gap: 8px;
        }

        button.control-btn {
            background: #e50914; 
            color: white;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        button.control-btn:hover { background: #b20710; }

        input[type="range"] {
            flex: 1;
            margin: 0 5px;
            cursor: pointer;
            accent-color: #e50914; 
        }

        #volumeBar { flex: 0.2; }

        #fullscreenBtn, #prevBtn, #nextBtn {
            background: #333;
        }
        #fullscreenBtn:hover, #prevBtn:hover, #nextBtn:hover {
            background: #555;
        }

        /* প্লেলিস্ট স্টাইল */
        .playlist {
            width: 720px;
            max-width: 100%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
        }

        button.playlist-btn {
            background: #333;
            color: white;
            border: 2px solid transparent;
            padding: 10px;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        button.playlist-btn:hover {
            background: #444;
            border-color: #e50914;
        }

        button.playlist-btn.active {
            background: #e50914;
            border-color: white;
            font-weight: bold;
        }

        .channel-logo {
            width: 50px;
            height: 50px;
            object-fit: contain;
            border-radius: 5px;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 2px;
        }

        h3 { margin: 0 0 15px 0; width: 720px; max-width: 100%; text-align: left; }
    </style>
</head>
<body>

    <div class="video-container" id="videoContainer">
        <video id="videoPlayer"></video>
        <div class="controls">
            <button id="playPauseBtn" class="control-btn">Play</button>
            <button id="prevBtn" class="control-btn" title="পূর্ববর্তী">◀ Prev</button>
            <button id="nextBtn" class="control-btn" title="পরবর্তী">Next ▶</button>
            <input type="range" id="progressBar" value="0" max="100">
            <input type="range" id="volumeBar" value="1" max="1" step="0.1" title="Volume">
            <button id="fullscreenBtn" class="control-btn">Full</button>
        </div>
    </div>

    <h3>ভিডিও তালিকা (প্লেলিস্ট):</h3>
    <div class="playlist" id="playlistContainer"></div>

    <script>
        const video = document.getElementById('videoPlayer');
        const videoContainer = document.getElementById('videoContainer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const playlistContainer = document.getElementById('playlistContainer');
        
        let hls; 
        let currentIndex = 0;

        const playlist = [
            { name: "চ্যানেল ১", logo: "https://i.ibb.co/DRkS2c3/T-Sports.png", url: "https://channel01-onlymex.akamaized.net/hls/live/2022749/event01/index_6.m3u8" }, 
            { name: "চ্যানেল ২", logo: "https://i.ibb.co/DRkS2c3/T-Sports.png", url: "https://tvex.easypecker.com/TSportsHD_sf_bdix/index.m3u8" },
            { name: "চ্যানেল ৩", logo: "https://i.ibb.co/DRkS2c3/T-Sports.png", url: "https://channel01-onlymex.akamaized.net/hls/live/2022749/event01/index_6.m3u8" },
            { name: "চ্যানেল ৪", logo: "https://i.ibb.co/DRkS2c3/T-Sports.png", url: "https://tvex.easypecker.com/TSportsHD_sf_bdix/index.m3u8" },
            { name: "চ্যানেল ৫", logo: "https://via.placeholder.com/100x100.png?text=CH5", url: "https://cdn-tt.pages.dev/ch1.m3u8" },
            { name: "চ্যানেল ৬", logo: "https://via.placeholder.com/100x100.png?text=CH6", url: "https://tvex.easypecker.com/TSportsHD_sf_bdix/index.m3u8" },
            { name: "চ্যানেল ৭", logo: "https://via.placeholder.com/100x100.png?text=CH7", url: "https://cdn-tt.pages.dev/ch1.m3u8" },
            { name: "চ্যানেল ৮", logo: "https://via.placeholder.com/100x100.png?text=CH8", url: "আপনার_m3u8_লিংক_৮" },
            { name: "চ্যানেল ৯", logo: "https://via.placeholder.com/100x100.png?text=CH9", url: "আপনার_m3u8_লিংক_৯" },
            { name: "চ্যানেল ১০", logo: "https://via.placeholder.com/100x100.png?text=CH10", url: "আপনার_m3u8_লিংক_১০" }
        ];

        function loadVideo(index) {
            if (index < 0 || index >= playlist.length) return; 
            
            currentIndex = index;
            const currentItem = playlist[currentIndex];

            if (hls) {
                hls.destroy();
            }

            if (Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(currentItem.url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function () {
                    video.play();
                    playPauseBtn.textContent = 'Pause';
                });
            } 
            else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = currentItem.url;
                video.addEventListener('loadedmetadata', function () {
                    video.play();
                    playPauseBtn.textContent = 'Pause';
                });
            }

            document.querySelectorAll('.playlist-btn').forEach((btn, idx) => {
                if (idx === currentIndex) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        playlist.forEach((item, index) => {
            const btn = document.createElement('button');
            btn.className = 'playlist-btn';
            
            const img = document.createElement('img');
            img.src = item.logo;
            img.alt = item.name;
            img.className = 'channel-logo';
            img.onerror = function() {
                this.src = "https://via.placeholder.com/50x50.png?text=No+Logo";
            };

            const span = document.createElement('span');
            span.textContent = item.name;
            span.className = 'channel-name';

            btn.appendChild(img);
            btn.appendChild(span);
            
            btn.addEventListener('click', () => loadVideo(index));
            playlistContainer.appendChild(btn);
        });

        loadVideo(0);

        // Play/Pause
        playPauseBtn.addEventListener('click', () => {
            if (video.paused) {
                video.play();
                playPauseBtn.textContent = 'Pause';
            } else {
                video.pause();
                playPauseBtn.textContent = 'Play';
            }
        });

        // Next বাটন লজিক
        nextBtn.addEventListener('click', () => {
            let nextIndex = currentIndex + 1;
            if (nextIndex >= playlist.length) {
                nextIndex = 0;
            }
            loadVideo(nextIndex);
        });

        // Prev বাটন লজিক
        prevBtn.addEventListener('click', () => {
            let prevIndex = currentIndex - 1;
            if (prevIndex < 0) {
                prevIndex = playlist.length - 1;
            }
            loadVideo(prevIndex);
        });

        // ভিডিও শেষ হলে স্বয়ংক্রিয়ভাবে পরের ভিডিও चालू হবে
        video.addEventListener('ended', () => {
            let nextIndex = currentIndex + 1;
            if (nextIndex < playlist.length) {
                loadVideo(nextIndex);
            } else {
                playPauseBtn.textContent = 'Play';
                document.getElementById('progressBar').value = 0;
            }
        });

        // Progress Bar
        video.addEventListener('timeupdate', () => {
            if (!isNaN(video.duration)) {
                const progress = (video.currentTime / video.duration) * 100;
                document.getElementById('progressBar').value = progress;
            }
        });

        document.getElementById('progressBar').addEventListener('input', (e) => {
            video.currentTime = (e.target.value / 100) * video.duration;
        });

        // Volume
        document.getElementById('volumeBar').addEventListener('input', (e) => {
            video.volume = e.target.value;
        });

        // =====================================
        // রোটেশন সহ ফুলস্ক্রিন লজিক
        // =====================================
        fullscreenBtn.addEventListener('click', async () => {
            try {
                if (!document.fullscreenElement) {
                    // ফুলস্ক্রিন চালু করা
                    if (videoContainer.requestFullscreen) {
                        await videoContainer.requestFullscreen();
                    } else if (videoContainer.webkitRequestFullscreen) {
                        await videoContainer.webkitRequestFullscreen();
                    }

                    // ফুলস্ক্রিন হওয়ার পর স্ক্রিন অটো-রোটেট (Landscape) করা
                    if (screen.orientation && screen.orientation.lock) {
                        await screen.orientation.lock('landscape').catch(err => {
                            console.log("রোটেশন লক সাপোর্ট করছে না বা ফোনে অটো-রোটেট অফ আছে:", err);
                        });
                    }
                } else {
                    // ফুলস্ক্রিন বন্ধ করা
                    if (document.exitFullscreen) {
                        await document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        await document.webkitExitFullscreen();
                    }
                }
            } catch (error) {
                console.error("ফুলস্ক্রিন বা রোটেশনে সমস্যা:", error);
            }
        });

        // ফুলস্ক্রিন পরিবর্তন ট্র্যাক করা
        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                fullscreenBtn.textContent = 'Exit';
            } else {
                fullscreenBtn.textContent = 'Full';
                // ফুলস্ক্রিন থেকে বের হয়ে গেলে রোটেশন লক খুলে দেওয়া
                if (screen.orientation && screen.orientation.unlock) {
                    screen.orientation.unlock();
                }
            }
        });
        
        // Safari (iOS) এর জন্য আলাদা ফুলস্ক্রিন পরিবর্তন ট্র্যাকিং
        document.addEventListener('webkitfullscreenchange', () => {
            if (document.webkitFullscreenElement) {
                fullscreenBtn.textContent = 'Exit';
            } else {
                fullscreenBtn.textContent = 'Full';
                if (screen.orientation && screen.orientation.unlock) {
                    screen.orientation.unlock();
                }
            }
        });
    </script>
</body>
</html>
